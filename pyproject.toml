[project]
name = "fengxuan-agent"
version = "0.1.0"
description = "fengxuanAgent 后端：登录 → RBAC 权限 → 对话与知识库 → 多智能体"
# 只允许 3.12：和你本机的 3.12.5 保持一致，避免本地能跑、服务器装不上的版本漂移
requires-python = ">=3.12,<3.13"

# 运行时依赖：只有真正跑服务需要的放这里，这些会进生产镜像
dependencies = [
    "fastapi>=0.115,<1.0",        # Web 框架
    "uvicorn[standard]>=0.30",    # 启动服务的 ASGI 服务器
    "sqlalchemy>=2.0.30,<3.0",    # ORM，统一用 2.0 写法
    "pymysql>=1.1",               # MySQL 驱动（同步）
    "cryptography>=42",           # MySQL 8 默认认证方式需要，漏了报认证失败
    "alembic>=1.13",              # 数据库迁移
    "pydantic-settings>=2.4",     # 从 .env 读配置（它自带 python-dotenv，不用再单独列）
    "pyjwt>=2.8",                 # JWT 签发与校验
    "bcrypt>=4.2",                # 密码哈希，直接用 bcrypt，不经 passlib
    "redis>=5.2,<6",
    "httpx==0.28.1",
    "qdrant-client>=1.13,<1.15",
    "fastembed>=0.9.1",
    "python-docx>=1.2,<2",
    "pypdf>=6,<7",
    "python-pptx>=1.0,<2",
    "openpyxl>=3.1,<4",
]

# 开发依赖：只在本机用，不进生产镜像（uv sync --no-dev 就会跳过这组）
[dependency-groups]
dev = [
    "pytest>=8.2",                # 测试
    # 测试里直接调接口
]

[tool.pytest.ini_options]
# 默认加载隔离插件，让用例不连真实库。
# --basetemp 固定临时根目录：本机 %TEMP% 下的 pytest-of-awen 被别的安全上下文锁住，
# 不指定就会在收集阶段报 PermissionError。产物落在项目根的 .pytest-tmp（已 git 忽略）。
# -m "not smoke"：连真实依赖的冒烟测试默认不跑，发版前用 pytest -m smoke 单独执行。
addopts = "-p tests.isolated_settings --basetemp=.pytest-tmp -m 'not smoke'"
markers = [
    "smoke: 连本机 Qdrant、MySQL 隔离库和外部模型的冒烟测试，默认不收集执行",
]

# 显式指定索引源：本机和服务器、Docker 构建都用同一个源，
# 避免"本机读到了哪个 pip 配置就从哪装"这种不可复现的情况。
# 换源只需改这一处，然后 uv lock 重新生成锁定文件。
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv]
# 这是一个应用，不是要发布到 PyPI 的库，不需要 build backend
package = false
# 默认就安装 dev 组；生产用 uv sync --no-dev
default-groups = ["dev"]
