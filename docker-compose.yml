# 本项目专用的本地基础设施：MySQL 8.4 + Redis 7 + Qdrant 1.13
#
# 用法：
#   docker compose up -d mysql      只起数据库（阶段一、二需要）
#   docker compose up -d redis      到阶段三需要缓存时再单独起
#   docker compose up -d qdrant     启用向量检索（VECTOR_ENABLED=true）时起
#   docker compose --profile verify up -d --force-recreate mysql-verify   发版前跑冒烟测试时临时起（每次都是空库），用完就停
#   docker compose ps               看状态，等 STATUS 出现 (healthy) 才算好
#
# 端口为什么是 3307 / 6380：
#   你本机的 3306（本地装的 MySQL）和 6379（本地装的 Redis）已经被占用，
#   另外几个项目还各占一套（13306 / 26379 / 16379）。本项目单独用一对端口，互不干扰。
#
# 数据放在命名卷里：docker compose down 不会丢数据，只有 docker compose down -v 才会删。

name: fengxuan

services:
  mysql:
    image: mysql:8.4
    container_name: fengxuan-mysql
    restart: unless-stopped
    ports:
      # 只绑 127.0.0.1：数据库不对局域网开放，别的机器连不进来
      - "127.0.0.1:3307:3306"
    environment:
      # 密码从项目根目录的 .env 读取；没设就直接报错，不给你一个空密码的库
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请先在 .env 里设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-fengxuan_agent}
      TZ: Asia/Shanghai
    command:
      # 字符集和时区在服务端统一设好，避免中文乱码和 created_at 差 8 小时
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - fengxuan_mysql_data:/var/lib/mysql
    healthcheck:
      # 用 mysqladmin ping 判断"能连上且能应答"，比只看进程在不在可靠
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: fengxuan-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fengxuan_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    # 版本固定：pyproject.toml 里 qdrant-client 限制在 <1.15，升级服务端前先对齐客户端
    image: qdrant/qdrant:v1.13.4
    container_name: fengxuan-qdrant
    restart: unless-stopped
    ports:
      # 只绑 127.0.0.1：Qdrant 没有设密码，不对局域网开放。6333 是 HTTP，6334 是 gRPC
      - "127.0.0.1:6335:6333"
      - "127.0.0.1:6336:6334"
    volumes:
      - fengxuan_qdrant_data:/qdrant/storage
    healthcheck:
      # 镜像里没有 curl 和 wget，借 bash 自带的 /dev/tcp 探测端口能否连通
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql-verify:
    # 仅供"连真实 MySQL 的验证"使用：冒烟测试 tests/test_smoke_real.py 和 tests/mysql_chat_checks.py。
    # 口令和库名写死成测试专用值：项目规定测试不得使用真实库凭证。
    # profiles 让它默认不启动，也不会跟着 docker compose up 一起起来。
    # 数据目录挂在内存盘上：容器一停数据就没了，每次重建都是空库（两个验证都要求从空库开始）：
    #   docker compose --profile verify up -d --force-recreate mysql-verify
    # 用完停掉：docker compose --profile verify stop mysql-verify
    # 不要用 docker compose down 来重置它：那会把 mysql / redis / qdrant 三个正式容器一并停掉。
    image: mysql:8.4
    container_name: fengxuan-mysql-verify
    profiles: ["verify"]
    restart: "no"
    ports:
      - "127.0.0.1:13317:3306"
    environment:
      MYSQL_ROOT_PASSWORD: chat-isolated-only
      MYSQL_DATABASE: chat_verify
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  fengxuan_mysql_data:
  fengxuan_redis_data:
  # 显式指定卷名：沿用容器纳入 compose 之前已有的数据卷，现有向量不需要重建
  fengxuan_qdrant_data:
    name: fengxuan-qdrant-data
